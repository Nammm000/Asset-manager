spring.mail.port=587
spring.mail.username= 000xyz.abc2001@gmail.com
spring.mail.password= sjjynvsjjynvtisnzmvfbmtisnzmvfbm
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.client.url=http://localhost:4200

# Rate limiting — per-identity sliding window (JWT subject, else client IP); excess -> 429 + Retry-After
app.rate-limit.requests-per-second=3

# Set to true when the app is served behind TLS; Secure cookies are rejected on plain http dev.
app.cookie.secure=false

# Notifications (WebSocket broadcast) — interval defaults to 30 minutes
app.notification.interval-ms=1800000
app.notification.message=Reminder: please review your assets.

# MinIO (S3-compatible) object storage for user images
app.minio.endpoint=http://localhost:9000
app.minio.access-key=minioadmin
app.minio.secret-key=minioadmin
app.minio.bucket=user-images

# Multipart cap sits above the 5MB avatar limit so oversize files fail in the service with a clear message
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB

# Redis cache — backing store for @Cacheable/@CacheEvict (see configuration/RedisCacheConfig)
spring.data.redis.host=localhost
spring.data.redis.port=6379
# Lettuce command timeout: caps how long a cache op stalls when Redis is unreachable
# (cache errors are swallowed by RedisCacheConfig's handler and requests fall through to the DB)
spring.data.redis.timeout=2s
# Inert with the custom CacheManager bean; documents the provider choice
spring.cache.type=redis

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5433/myassets
spring.datasource.username=myuser
spring.datasource.password=mypassword
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Disable JPA second-level cache to prevent memory leaks
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false