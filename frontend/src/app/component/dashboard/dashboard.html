<div class="page">
  <div class="page-header">
    <h1 class="page-title">Dashboard</h1>
    <p class="page-subtitle">{{ welcome() }}</p>
  </div>

  <div class="quick-link-grid">
    @for (item of items(); track item.path) {
      <a class="quick-link" [routerLink]="['/' + item.path]">
        <span class="quick-link__title">{{ item.label }}</span>
        <span class="quick-link__description">{{ item.description }}</span>
      </a>
    }
  </div>
</div>
