<header class="header">
  <div class="header__logo">
    <img src="../../../../assets/img/thumbs-up-icon.svg" alt="Logo" class="header__logo-img">
  </div>

  @if (authService.isAuthenticated()) {
    <!-- Authenticated: avatar replaces the auth buttons and the hamburger at all widths -->
    <div class="header__avatar-menu">
      <button class="header__avatar-btn"
              type="button"
              (click)="toggleDropdown()"
              aria-haspopup="menu"
              [attr.aria-expanded]="isDropdownOpen()"
              aria-label="User menu">
        @if (avatarSrc(); as src) {
          <img class="header__avatar-img" [src]="src" alt="Profile avatar" (error)="onAvatarError()" />
        } @else {
          <span class="header__avatar-initials">{{ initials() }}</span>
        }
      </button>

      @if (isDropdownOpen()) {
        <nav class="header__dropdown" role="menu" aria-label="User menu">
          <a class="header__dropdown-item header__dropdown-item--link" role="menuitem" routerLink="/user-setting"
             routerLinkActive="header__dropdown-item--active" (click)="closeDropdown()">Settings</a>
          <button class="header__dropdown-item" type="button" role="menuitem"
                  (click)="openChangePassword()">Change Password</button>
          <button class="header__dropdown-item header__dropdown-item--danger" type="button" role="menuitem"
                  (click)="logout()">Logout</button>
        </nav>
      }
    </div>
  } @else {
    <!-- Desktop: Auth buttons -->
    <nav class="header__nav desktop-only">
      <button class="btn btn--login" (click)="openLogin()">Login</button>
      <button class="btn btn--signup" (click)="openSignup()">Sign Up</button>
    </nav>

    <!-- Mobile: Hamburger menu -->
    <button class="header__hamburger mobile-only"
            (click)="toggleMobileMenu()"
            [class.active]="isMobileMenuOpen()">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- Mobile menu dropdown -->
    @if (isMobileMenuOpen()) {
      <nav class="header__mobile-menu mobile-only">
        <button class="btn btn--login" (click)="openLogin()">Login</button>
        <button class="btn btn--signup" (click)="openSignup()">Sign Up</button>
      </nav>
    }
  }
</header>
